<svg xmlns="http://www.w3.org/2000/svg" width="920" height="310" viewBox="0 0 920 310" role="img" aria-labelledby="title description">
<title id="title">Preregistered observer calibration</title>
<desc id="description">Accuracy by development format and the separately held-out calibration set. The gate requires 80 percent on both development and calibration.</desc>
<rect width="920" height="310" rx="14" fill="#111827"/>
<g font-family="sans-serif" fill="#f9fafb">
<text x="26" y="37" font-size="22">Observer calibration: STOP</text>
<text x="26" y="62" font-size="14" fill="#cbd5e1">Format chosen on development data; independent gate checked once</text>
<text x="26" y="108" font-size="15">Development: table</text>
<rect x="290" y="90" width="500" height="26" rx="4" fill="#334155"/>
<rect x="290" y="90" width="307.29" height="26" rx="4" fill="#f59e0b"/>
<text x="812" y="108" font-size="16">61.5%</text>
<text x="26" y="144" font-size="15">Development: equations</text>
<rect x="290" y="126" width="500" height="26" rx="4" fill="#334155"/>
<rect x="290" y="126" width="317.71" height="26" rx="4" fill="#f59e0b"/>
<text x="812" y="144" font-size="16">63.5%</text>
<text x="26" y="180" font-size="15">Development: grouped</text>
<rect x="290" y="162" width="500" height="26" rx="4" fill="#334155"/>
<rect x="290" y="162" width="296.88" height="26" rx="4" fill="#f59e0b"/>
<text x="812" y="180" font-size="16">59.4%</text>
<text x="26" y="216" font-size="15">Independent calibration</text>
<rect x="290" y="198" width="500" height="26" rx="4" fill="#334155"/>
<rect x="290" y="198" width="257.81" height="26" rx="4" fill="#f59e0b"/>
<text x="812" y="216" font-size="16">51.6%</text>
<line x1="690" x2="690" y1="80" y2="236" stroke="#f8fafc" stroke-width="2" stroke-dasharray="5 4"/>
<text x="652" y="257" font-size="13">80% gate</text>
<text x="26" y="285" font-size="13" fill="#cbd5e1">Independent: 33/64; UNKNOWN counts incorrect. No attack outcome is shown here.</text>
</g></svg>
