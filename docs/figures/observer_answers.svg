<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<title id="title">Projected circuit observer answers</title>
<desc id="desc">One circuit, two prompt wordings. Ground truth A. Cells show actual answers, not an attack success rate.</desc>
<rect width="900" height="400" rx="16" fill="#111827"/>
<g font-family="sans-serif" fill="#f9fafb">
<text x="28" y="38" font-size="22">Same function, different observer answers</text>
<text x="28" y="65" fill="#cbd5e1" font-size="14">Exploratory: ONE circuit / TWO wordings / correct answer = A</text>
<text x="340" y="99">Wording 0</text><text x="580" y="99">Wording 1</text>
<text x="28" y="142" font-size="16">original</text>
<rect x="320" y="116" width="210" height="35" rx="6" fill="#14532d"/><text x="425" y="140" text-anchor="middle" font-size="18">A</text>
<rect x="560" y="116" width="210" height="35" rx="6" fill="#7f1d1d"/><text x="665" y="140" text-anchor="middle" font-size="18">B</text>
<text x="28" y="187" font-size="16">structure_only</text>
<rect x="320" y="161" width="210" height="35" rx="6" fill="#7f1d1d"/><text x="425" y="185" text-anchor="middle" font-size="18">N/A</text>
<rect x="560" y="161" width="210" height="35" rx="6" fill="#7f1d1d"/><text x="665" y="185" text-anchor="middle" font-size="18">N/A</text>
<text x="28" y="232" font-size="16">random_locations</text>
<rect x="320" y="206" width="210" height="35" rx="6" fill="#7f1d1d"/><text x="425" y="230" text-anchor="middle" font-size="18">N/A</text>
<rect x="560" y="206" width="210" height="35" rx="6" fill="#7f1d1d"/><text x="665" y="230" text-anchor="middle" font-size="18">N/A</text>
<text x="28" y="277" font-size="16">weight_informed</text>
<rect x="320" y="251" width="210" height="35" rx="6" fill="#7f1d1d"/><text x="425" y="275" text-anchor="middle" font-size="18">N/A</text>
<rect x="560" y="251" width="210" height="35" rx="6" fill="#7f1d1d"/><text x="665" y="275" text-anchor="middle" font-size="18">N/A</text>
<text x="28" y="322" font-size="16">location_shuffled</text>
<rect x="320" y="296" width="210" height="35" rx="6" fill="#7f1d1d"/><text x="425" y="320" text-anchor="middle" font-size="18">N/A</text>
<rect x="560" y="296" width="210" height="35" rx="6" fill="#7f1d1d"/><text x="665" y="320" text-anchor="middle" font-size="18">N/A</text>
<text x="28" y="374" fill="#cbd5e1" font-size="14">Green: correct  ·  Red: wrong  ·  Amber: tied scores. No causal advantage established.</text>
</g></svg>
